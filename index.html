<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Stingray Swarm - Polimaxx Interactive Env</title>
    <style>
        body { 
            margin: 0; 
            background: #00050a; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            touch-action: none; /* ป้องกันการเลื่อนหน้าจอบนมือถือ */
            -webkit-user-select: none;
            user-select: none;
        }
        canvas { display: block; outline: none; }
        .lil-gui { --width: 300px; }

        #mode-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        #mode-toggle.daylight-ui {
            background: rgba(255, 255, 255, 0.7);
            color: #0e3a66; 
            border: 1px solid rgba(14, 58, 102, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        #mode-toggle:hover {
            transform: translateY(-2px);
            background: rgba(0, 0, 0, 0.6);
        }
        #mode-toggle.daylight-ui:hover {
            background: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body>

    <button id="mode-toggle">
        <span id="mode-icon">🌙</span>
        <span id="mode-text">Dark Mode</span>
    </button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19"></script>

    <script>
        const config = {
            count: 15, 
            bounds: 80,
            minSpeed: 0.12,
            maxSpeed: 0.2,
            turnSpeed: 0.012, 
            flapStrength: 0.6,
            flapSpeed: 0.75,
            eyeHover: 0.08,
            eyeX: 0.45,
            eyeY: 1.50, 
            bodyDepth: 0.45, 
            wingTaper: 0.15, 
            tailCount: 22,   
            baseColor: '#ef0101', 
            eyeColor: '#3928b8',  
            tailColor: '#0e5167',
            bloomStrength: 1.5,
            bloomRadius: 0.4,
            bloomThreshold: 0.21,
            separationDist: 15,
            separationForce: 0.05
        };

        const envSettings = {
            background: '#000810',
            ambientIntensity: 1.0,
            sunIntensity: 0.8,
            rimIntensity: 1.5,
            fogNear: 40,
            fogFar: 150,
            showGrid: true,
            preset: 'Dark'
        };

        let scene, camera, renderer, composer, bloomPass, rayInstances = [];
        let ambientLight, sunLight, rimLight, gridHelper;
        let sharedMaterial, eyeMaterial, tailMaterial; 
        let isPointerDown = false, pointerPos = { x: 0, y: 0 };
        let orbitRotation = { x: 0.2, y: 0 };
        let zoom = 110; 
        let lastTimestamp = 0;
        let gui;

        // สำหรับ Multi-touch Zoom
        let initialPinchDist = 0;
        let initialZoom = 0;

        function getBrightness(hexColor) {
            const rgb = parseInt(hexColor.replace('#', ''), 16);
            const r = (rgb >> 16) & 0xff;
            const g = (rgb >> 8) & 0xff;
            const b = (rgb >> 0) & 0xff;
            return (r * 299 + g * 587 + b * 114) / 1000;
        }

        function createPolimaxxTexture(color = '#ffffff') {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            const brightness = getBrightness(color);
            const brandBlue = '#0e3a66', brandOrange = '#f37021';
            const textColor = brightness > 140 ? brandBlue : '#ffffff';

            ctx.fillStyle = color; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = brandOrange; ctx.fillRect(0, 0, 2048, 60); 
            ctx.fillStyle = brandBlue; ctx.fillRect(0, 964, 2048, 60);
            
            const drawLogoSet = (offsetX, isMirror = false) => {
                ctx.save();
                ctx.translate(offsetX + 512, 512);
                if (isMirror) ctx.scale(-1, 1);
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 10;
                ctx.fillStyle = textColor; ctx.font = 'bold 44px Arial'; ctx.fillText('POLIMAXX', 0, -145);
                ctx.fillStyle = brandOrange; ctx.font = '900 220px Arial'; ctx.fillText('PP', 0, -10);
                ctx.fillStyle = textColor; ctx.font = 'bold 38px Arial'; ctx.fillText('POLYETHYLENE', 0, 105);
                ctx.restore();
            };
            drawLogoSet(0, false); drawLogoSet(1024, true); 
            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        class Stingray {
            constructor() {
                this.group = new THREE.Group();
                this.animTime = Math.random() * 100;
                
                const rand = Math.random();
                let scale;
                if (rand > 0.92) scale = 4.5 + Math.random() * 2.0; 
                else if (rand > 0.75) scale = 2.5 + Math.random() * 1.5; 
                else scale = 0.8 + Math.random() * 0.8; 

                this.group.scale.set(scale, scale, scale);
                this.radius = scale * 2.5;

                const baseSpeed = config.minSpeed + Math.random() * (config.maxSpeed - config.minSpeed);
                this.moveSpeed = scale > 3 ? baseSpeed * 0.5 : baseSpeed;

                const angle = Math.random() * Math.PI * 2;
                this.direction = new THREE.Vector3(Math.cos(angle), (Math.random()-0.5)*0.1, Math.sin(angle)).normalize();
                this.targetDirection = this.direction.clone();
                this.group.position.set((Math.random()-0.5)*140, (Math.random()-0.5)*50, (Math.random()-0.5)*140);
                this.changeTargetTime = 0;
                this.currentRoll = 0; 
                this.initMesh();
                scene.add(this.group);
            }

            initMesh() {
                const shape = new THREE.Shape();
                shape.moveTo(0, -1.8); 
                shape.bezierCurveTo(1.7, -1.6, 3.2, -0.8, 3.2, 0); 
                shape.bezierCurveTo(3.2, 0.8, 1.4, 1.6, 0, 1.8); 
                shape.bezierCurveTo(-1.4, 1.6, -3.2, 0.8, -3.2, 0); 
                shape.bezierCurveTo(-3.2, -0.8, -1.7, -1.6, 0, -1.8);

                const geometry = new THREE.ExtrudeBufferGeometry(shape, { 
                    depth: config.bodyDepth, 
                    bevelEnabled: true, 
                    bevelThickness: 0.15, 
                    bevelSize: 0.3, 
                    bevelSegments: 15 
                });

                const pos = geometry.attributes.position;
                const uvs = geometry.attributes.uv;

                for (let i = 0; i < pos.count; i++) {
                    const x = pos.getX(i);
                    const y = pos.getY(i);
                    const z = pos.getZ(i);
                    
                    const distFromCenter = Math.abs(x) / 3.2; 
                    const taperFactor = THREE.MathUtils.lerp(1.0, config.wingTaper, distFromCenter);
                    
                    const centeredZ = z - (config.bodyDepth / 2);
                    pos.setZ(i, (centeredZ * taperFactor) + (config.bodyDepth / 2));

                    if (z >= config.bodyDepth - 0.05) {
                        uvs.setXY(i, (-x / 6.4 * 0.45) + 0.25, (-y / 3.6 * 0.45) + 0.5);
                    } else if (z <= 0.05) {
                        uvs.setXY(i, (-x / 6.4 * 0.45) + 0.75, (-y / 3.6 * 0.45) + 0.5);
                    } else {
                        uvs.setXY(i, 0.5, (z > config.bodyDepth / 2) ? 0.03 : 0.97);
                    }
                }
                
                this.initialPositions = new Float32Array(pos.array);
                this.mesh = new THREE.Mesh(geometry, sharedMaterial);
                this.mesh.rotation.x = -Math.PI / 2; 
                this.group.add(this.mesh);

                const eyeGeo = new THREE.SphereBufferGeometry(0.12, 16, 16);
                this.eyeL = new THREE.Mesh(eyeGeo, eyeMaterial); 
                this.eyeR = new THREE.Mesh(eyeGeo, eyeMaterial);
                
                const eyeDistFromCenter = config.eyeX / 3.2;
                const eyeTaperFactor = THREE.MathUtils.lerp(1.0, config.wingTaper, eyeDistFromCenter);
                this.eyeZPos = (config.bodyDepth / 2) * eyeTaperFactor; 

                this.mesh.add(this.eyeL, this.eyeR);

                this.tailGroup = new THREE.Group();
                this.tailSegments = [];
                let lastSeg = null; 
                for (let i = 0; i < config.tailCount; i++) {
                    const radius = 0.06 * (1 - (i / config.tailCount)) + 0.005;
                    const segGeo = new THREE.CylinderBufferGeometry(radius * 0.8, radius, 0.22, 8);
                    segGeo.translate(0, -0.11, 0); 
                    const seg = new THREE.Mesh(segGeo, tailMaterial);
                    if (i === 0) { seg.position.set(0, 1.8, config.bodyDepth/2); this.tailGroup.add(seg); }
                    else { seg.position.set(0, 0.22, 0); lastSeg.add(seg); }
                    this.tailSegments.push(seg); lastSeg = seg;
                }
                this.mesh.add(this.tailGroup);
            }

            update(delta, allRays) {
                this.animTime += delta * 0.003 * config.flapSpeed;
                const t = this.animTime;

                if (t > this.changeTargetTime) {
                    const angle = Math.atan2(this.direction.x, this.direction.z) + (Math.random()-0.5)*Math.PI*0.5;
                    this.targetDirection.set(Math.sin(angle), (Math.random()-0.5)*0.2, Math.cos(angle)).normalize();
                    this.changeTargetTime = t + 10 + Math.random()*20;
                }

                const separationVec = new THREE.Vector3();
                let count = 0;
                for(let other of allRays) {
                    if (other === this) continue;
                    const dist = this.group.position.distanceTo(other.group.position);
                    const minDist = (this.radius + other.radius) + config.separationDist;
                    if (dist < minDist) {
                        const diff = new THREE.Vector3().subVectors(this.group.position, other.group.position);
                        diff.normalize().divideScalar(Math.max(0.1, dist));
                        separationVec.add(diff);
                        count++;
                    }
                }
                if (count > 0) {
                    separationVec.divideScalar(count);
                    this.targetDirection.add(separationVec.multiplyScalar(config.separationForce)).normalize();
                }

                if (this.group.position.length() > config.bounds) {
                    this.targetDirection.lerp(new THREE.Vector3().copy(this.group.position).negate().normalize(), 0.02).normalize();
                }

                const lastY = this.group.rotation.y;
                const dummy = new THREE.Object3D();
                dummy.position.copy(this.group.position);
                dummy.lookAt(new THREE.Vector3().copy(this.group.position).add(this.targetDirection));
                this.group.quaternion.rotateTowards(dummy.quaternion, config.turnSpeed);
                
                let turnDiff = this.group.rotation.y - lastY;
                if (turnDiff > Math.PI) turnDiff -= Math.PI*2; if (turnDiff < -Math.PI) turnDiff += Math.PI*2;
                this.currentRoll = THREE.MathUtils.lerp(this.currentRoll, -turnDiff*30, 0.05);
                this.mesh.rotation.y = this.currentRoll; 
                this.group.translateZ(this.moveSpeed);

                const posAttr = this.mesh.geometry.attributes.position;
                for (let i = 0; i < posAttr.count; i++) {
                    const x = this.initialPositions[i*3], y = this.initialPositions[i*3+1], pz = this.initialPositions[i*3+2];
                    const d = Math.abs(x);
                    const flapAmp = (d <= 0.4 ? d*0.1 : (d-0.4)*1.2);
                    const wave = Math.sin(t + d*1.8 - y*0.5) * 0.35 * flapAmp * config.flapStrength;
                    posAttr.setZ(i, pz + wave);
                }
                posAttr.needsUpdate = true;
                
                const getW = (x, y) => { const d = Math.abs(x); return Math.sin(t + d*1.8 - y*0.5)*0.35*(d<=0.4?d*0.1:(d-0.4)*1.2)*config.flapStrength; };
                
                const surfaceZ = (config.bodyDepth / 2) + this.eyeZPos; 
                this.eyeL.position.set(-config.eyeX, -config.eyeY, surfaceZ + config.eyeHover + getW(-config.eyeX, -config.eyeY));
                this.eyeR.position.set(config.eyeX, -config.eyeY, surfaceZ + config.eyeHover + getW(config.eyeX, -config.eyeY));
                
                this.tailSegments.forEach((seg, i) => {
                    seg.rotation.z = Math.sin(t*0.8/config.flapSpeed - i*0.15)*0.18;
                    seg.rotation.x = Math.cos(t*0.8/config.flapSpeed - i*0.15)*0.12;
                });
            }
        }

        function updateGridColor(preset) {
            if (gridHelper) scene.remove(gridHelper);
            const gridColor = (preset === 'Dark') ? 0x00ffff : 0x004488;
            gridHelper = new THREE.GridHelper(500, 50, gridColor, gridColor);
            gridHelper.position.y = -60;
            if(envSettings.showGrid) scene.add(gridHelper);
        }

        function applyPreset(v) {
            const btn = document.getElementById('mode-toggle');
            if (v === 'Daylight') {
                envSettings.background = '#88ccff';
                envSettings.ambientIntensity = 1.6;
                envSettings.sunIntensity = 1.2;
                envSettings.rimIntensity = 0.6;
                envSettings.fogNear = 100;
                envSettings.fogFar = 500;
                bloomPass.strength = 0.2; 
                eyeMaterial.emissiveIntensity = 0.4;
                tailMaterial.emissiveIntensity = 0.2;
                document.getElementById('mode-text').innerText = 'Daylight Mode';
                document.getElementById('mode-icon').innerText = '☀️';
                btn.classList.add('daylight-ui');
            } else {
                envSettings.background = '#000810';
                envSettings.ambientIntensity = 1.0;
                envSettings.sunIntensity = 0.8;
                envSettings.rimIntensity = 1.5;
                envSettings.fogNear = 40;
                envSettings.fogFar = 150;
                bloomPass.strength = 1.5;
                eyeMaterial.emissiveIntensity = 2.0;
                tailMaterial.emissiveIntensity = 1.5;
                document.getElementById('mode-text').innerText = 'Dark Mode';
                document.getElementById('mode-icon').innerText = '🌙';
                btn.classList.remove('daylight-ui');
            }
            updateGridColor(v);
            scene.background.set(envSettings.background);
            scene.fog.color.set(envSettings.background);
            scene.fog.near = envSettings.fogNear;
            scene.fog.far = envSettings.fogFar;
            ambientLight.intensity = envSettings.ambientIntensity;
            sunLight.intensity = envSettings.sunIntensity;
            rimLight.intensity = envSettings.rimIntensity;
            if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
        }

        function initGUI() {
            if (gui) gui.destroy();
            gui = new lil.GUI({ title: 'Polimaxx Stingray Swarm' });
            
            const envFolder = gui.addFolder('Environment Settings');
            envFolder.add(envSettings, 'preset', ['Dark', 'Daylight']).name('Mode Preset').onChange(applyPreset);

            const motionFolder = gui.addFolder('Stingray Motion');
            motionFolder.add(config, 'flapSpeed', 0.1, 2.0).name('Flap Speed');
            motionFolder.add(config, 'flapStrength', 0.1, 2.0).name('Flap Strength');

            const bodyFolder = gui.addFolder('Body Structure');
            bodyFolder.add(config, 'bodyDepth', 0.1, 1.0).name('Center Thickness').onChange(() => {
                rayInstances.forEach(r => { scene.remove(r.group); });
                rayInstances = [];
                for (let i = 0; i < config.count; i++) rayInstances.push(new Stingray());
            });
            bodyFolder.add(config, 'wingTaper', 0.05, 1.0).name('Wing Taper (Slope)').onChange(() => {
                rayInstances.forEach(r => { scene.remove(r.group); });
                rayInstances = [];
                for (let i = 0; i < config.count; i++) rayInstances.push(new Stingray());
            });

            const colorFolder = gui.addFolder('Stingray Appearance');
            colorFolder.addColor(config, 'baseColor').name('Body Color').onChange(v => {
                sharedMaterial.map.dispose(); sharedMaterial.map = createPolimaxxTexture(v);
            });
            colorFolder.addColor(config, 'eyeColor').name('Eye Color').onChange(v => {
                eyeMaterial.color.set(v); eyeMaterial.emissive.set(v);
            });

            gui.close();
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(envSettings.background);
            scene.fog = new THREE.Fog(envSettings.background, envSettings.fogNear, envSettings.fogFar);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            const renderScene = new THREE.RenderPass(scene, camera);
            bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), config.bloomStrength, config.bloomRadius, config.bloomThreshold);
            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            sharedMaterial = new THREE.MeshStandardMaterial({ map: createPolimaxxTexture(config.baseColor), roughness: 0.3, metalness: 0.2 });
            eyeMaterial = new THREE.MeshPhongMaterial({ color: config.eyeColor, emissive: config.eyeColor, emissiveIntensity: 2.0, shininess: 100 });
            tailMaterial = new THREE.MeshStandardMaterial({ color: config.tailColor, emissive: config.tailColor, emissiveIntensity: 1.5 });

            updateGridColor(envSettings.preset);

            ambientLight = new THREE.AmbientLight(0x4488ff, envSettings.ambientIntensity); scene.add(ambientLight);
            sunLight = new THREE.DirectionalLight(0xffffff, envSettings.sunIntensity);
            sunLight.position.set(50, 100, 50); scene.add(sunLight);
            rimLight = new THREE.DirectionalLight(0xffffff, envSettings.rimIntensity);
            rimLight.position.set(-50, -50, -50); scene.add(rimLight);

            for (let i = 0; i < config.count; i++) rayInstances.push(new Stingray());

            updateCamera();
            setupInteractions();
            initGUI();
            setupExternalToggle();
            window.addEventListener('resize', onResize);
            requestAnimationFrame(animate);
        }

        function setupExternalToggle() {
            document.getElementById('mode-toggle').addEventListener('click', () => {
                envSettings.preset = (envSettings.preset === 'Dark') ? 'Daylight' : 'Dark';
                applyPreset(envSettings.preset);
            });
        }

        // ระบบ Interaction ใหม่ที่เหมาะสมกับ Mobile/Tablet
        function setupInteractions() {
            const el = renderer.domElement;
            const touches = new Map();

            el.addEventListener('pointerdown', e => {
                if(e.target.closest('.lil-gui') || e.target.closest('#mode-toggle')) return; 
                
                touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
                isPointerDown = true;
                pointerPos = { x: e.clientX, y: e.clientY };
                
                // จัดการ Pinch Zoom (Multi-touch)
                if (touches.size === 2) {
                    const pts = Array.from(touches.values());
                    initialPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                    initialZoom = zoom;
                }
                
                el.setPointerCapture(e.pointerId);
            });

            window.addEventListener('pointermove', e => {
                if (!touches.has(e.pointerId)) return;
                touches.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (touches.size === 1) {
                    // หมุนกล้อง (1 นิ้ว)
                    orbitRotation.y -= (e.clientX - pointerPos.x) * 0.005;
                    orbitRotation.x -= (e.clientY - pointerPos.y) * 0.005;
                    orbitRotation.x = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, orbitRotation.x));
                    pointerPos = { x: e.clientX, y: e.clientY };
                } else if (touches.size === 2) {
                    // ซูม (2 นิ้ว)
                    const pts = Array.from(touches.values());
                    const currentDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                    const diff = initialPinchDist - currentDist;
                    zoom = THREE.MathUtils.clamp(initialZoom + diff * 0.5, 30, 600);
                }
                
                updateCamera();
            });

            const endPointer = (e) => {
                touches.delete(e.pointerId);
                if (touches.size < 1) isPointerDown = false;
                if (touches.size < 2) initialPinchDist = 0;
            };

            window.addEventListener('pointerup', endPointer);
            window.addEventListener('pointercancel', endPointer);

            // รองรับ Wheel บน Desktop เหมือนเดิม
            el.addEventListener('wheel', e => {
                zoom = THREE.MathUtils.clamp(zoom + e.deltaY * 0.1, 30, 600);
                updateCamera();
            }, { passive: true });
        }

        function updateCamera() {
            camera.position.set(
                zoom * Math.sin(orbitRotation.y) * Math.cos(orbitRotation.x),
                zoom * Math.sin(orbitRotation.x),
                zoom * Math.cos(orbitRotation.y) * Math.cos(orbitRotation.x)
            );
            camera.lookAt(0, 0, 0);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight); 
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(timestamp) {
            requestAnimationFrame(animate);
            const delta = timestamp - (lastTimestamp || timestamp);
            lastTimestamp = timestamp;
            rayInstances.forEach(ray => ray.update(delta, rayInstances));
            composer.render();
        }

        window.onload = init;
    </script>
</body>
</html>
