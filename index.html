<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Stingray Swarm - Polimaxx Interactive Env</title>
  </head>
  <body>
    <div id="loading" class="loading-overlay">
      <div class="loading-spinner"></div>
      <div class="loading-text">Preparing stingrays…</div>
    </div>

    <button id="mode-toggle" type="button">
      <span id="mode-icon">🌙</span>
      <span id="mode-text">Dark Mode</span>
    </button>

    <!-- Control hint (bottom-right): tells the user the mouse can orbit + zoom.
         Hidden until the loading overlay clears (see main.ts). -->
    <div id="control-hint" class="control-hint" aria-hidden="true">
      <svg
        class="control-hint__icon"
        viewBox="0 0 24 32"
        width="20"
        height="27"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="5" y="2" width="14" height="24" rx="7" />
        <line x1="12" y1="7" x2="12" y2="11" />
        <line x1="10" y1="6" x2="10" y2="8" />
        <line x1="14" y1="6" x2="14" y2="8" />
        <path d="M12 26l-2.5 4h5L12 26z" fill="currentColor" stroke="none" />
      </svg>
      <span class="control-hint__text">Scroll to zoom · Drag to orbit</span>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
