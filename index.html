<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Stingray Swarm - Polimaxx Dynamic Theme</title>
    <style>
        body { 
            margin: 0; 
            background: #00050a; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            transition: background 0.8s ease;
        }
        canvas { display: block; outline: none; }
        
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }
        #info {
            color: rgba(127, 127, 127, 0.6);
            font-size: 11px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .btn-toggle {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 22px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-transform: uppercase;
        }
        body.daylight-active .btn-toggle {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(14, 58, 102, 0.2);
            color: #0e3a66;
            box-shadow: 0 4px 15px rgba(0, 168, 232, 0.2);
        }
        .btn-toggle:hover {
            transform: scale(1.05);
            background: #ef0101;
            color: white;
            border-color: #ef0101;
        }
    </style>
</head>
<body class="dark-mode-active">

    <div id="ui-layer">
        <div id="info">POLIMAXX PRODUCT VISUALIZER</div>
        <button id="modeToggle" class="btn-toggle">SWITCH TO SUNNY OCEAN</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
        const config = {
            count: 10,
            bounds: 60,
            minSpeed: 0.12,
            maxSpeed: 0.2,
            turnSpeed: 0.012, 
            flapStrength: 0.6,
            flapSpeed: 0.75,
            eyeHover: 0.23,
            eyeX: 0.31,
            eyeY: 1.53, 
            bodyDepth: 0.25, 
            wingTaper: 0.85, 
            tailCount: 22,   
            darkBase: '#ef0101', 
            lightBase: '#0e3a66',
            eyeColor: '#3928b8',  
            tailColor: '#0e5167',
            particleCount: 1500
        };

        let scene, camera, renderer, composer, bloomPass, rayInstances = [];
        let sharedMaterial, eyeMaterial, tailMaterial, floorMaterial;
        let spotLight, sunLight, ambientLight, hemiLight, marineSnow;
        
        // Input Variables
        let mouse = new THREE.Vector2(0, 0);
        let targetRotation = new THREE.Vector2(0, 0);
        let currentRotation = new THREE.Vector2(0, 0);
        let targetZoom = 100;
        let currentZoom = 100;
        let lastTimestamp = 0;
        let isDarkMode = true;
        let darkTexture, lightTexture;

        // Touch handling
        let touchStartDist = 0;
        let isTouching = false;
        let lastTouchPos = new THREE.Vector2();

        function createPolimaxxTexture(baseColor, isLightMode = false) {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            const brandBlue = '#0e3a66', brandOrange = '#f37021';
            
            ctx.fillStyle = baseColor; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = brandOrange; ctx.fillRect(0, 0, 2048, 60); 
            ctx.fillStyle = isLightMode ? '#0a2a4d' : brandBlue; ctx.fillRect(0, 964, 2048, 60);
            
            const drawLogoSet = (offsetX, isMirror = false) => {
                ctx.save();
                ctx.translate(offsetX + 512, 512);
                if (isMirror) ctx.scale(-1, 1);
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillStyle = "#ffffff"; ctx.font = 'bold 44px Arial'; ctx.fillText('POLIMAXX', 0, -145);
                ctx.fillStyle = brandOrange; ctx.font = '900 220px Arial'; ctx.fillText('PP', 0, -10);
                ctx.fillStyle = "#ffffff"; ctx.font = 'bold 38px Arial'; ctx.fillText('POLYETHYLENE', 0, 105);
                ctx.restore();
            };
            drawLogoSet(0, false); drawLogoSet(1024, true); 
            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = 16;
            return tex;
        }

        class Stingray {
            constructor() {
                this.group = new THREE.Group();
                this.animTime = Math.random() * 100;
                this.moveSpeed = config.minSpeed + Math.random() * (config.maxSpeed - config.minSpeed);
                const angle = Math.random() * Math.PI * 2;
                this.direction = new THREE.Vector3(Math.cos(angle), (Math.random()-0.5)*0.2, Math.sin(angle)).normalize();
                this.targetDirection = this.direction.clone();
                this.group.position.set((Math.random()-0.5)*100, 20 + Math.random()*40, (Math.random()-0.5)*100);
                this.changeTargetTime = 0;
                this.currentRoll = 0; 
                this.initMesh();
                scene.add(this.group);
            }

            initMesh() {
                const shape = new THREE.Shape();
                shape.moveTo(0, -1.8); shape.bezierCurveTo(1.7, -1.6, 2.7, -0.8, 2.7, 0); 
                shape.bezierCurveTo(2.7, 0.8, 1.4, 1.6, 0, 1.8); shape.bezierCurveTo(-1.4, 1.6, -2.7, 0.8, -2.7, 0); 
                shape.bezierCurveTo(-2.7, -0.8, -1.7, -1.6, 0, -1.8);
                
                const geometry = new THREE.ExtrudeBufferGeometry(shape, { 
                    depth: config.bodyDepth, 
                    bevelEnabled: true, bevelThickness: 0.12, bevelSize: 0.25, bevelSegments: 15 
                });

                const pos = geometry.attributes.position;
                const uvs = geometry.attributes.uv;
                for (let i = 0; i < pos.count; i++) {
                    const x = pos.getX(i), y = pos.getY(i), pz = pos.getZ(i);
                    if (pz >= config.bodyDepth + 0.1) uvs.setXY(i, (-x / 5.4 * 0.45) + 0.25, (-y / 3.6 * 0.45) + 0.5);
                    else if (pz <= -0.1) uvs.setXY(i, (-x / 5.4 * 0.45) + 0.75, (-y / 3.6 * 0.45) + 0.5);
                    else uvs.setXY(i, 0.5, (pz > config.bodyDepth / 2) ? 0.03 : 0.97);
                }
                
                this.initialPositions = new Float32Array(pos.array);
                this.mesh = new THREE.Mesh(geometry, sharedMaterial);
                this.mesh.rotation.x = -Math.PI / 2; 
                this.group.add(this.mesh);

                const eyeGeo = new THREE.SphereBufferGeometry(0.12, 16, 16);
                this.eyeL = new THREE.Mesh(eyeGeo, eyeMaterial); 
                this.eyeR = new THREE.Mesh(eyeGeo, eyeMaterial);
                this.mesh.add(this.eyeL, this.eyeR);

                this.tailGroup = new THREE.Group();
                this.tailSegments = [];
                let lastSeg = null; 
                for (let i = 0; i < config.tailCount; i++) {
                    const radius = 0.06 * (1 - (i / config.tailCount)) + 0.005;
                    const segGeo = new THREE.CylinderBufferGeometry(radius * 0.8, radius, 0.22, 8);
                    segGeo.translate(0, -0.11, 0); 
                    const seg = new THREE.Mesh(segGeo, tailMaterial);
                    if (i === 0) { seg.position.set(0, 1.8, 0.12); this.tailGroup.add(seg); }
                    else { seg.position.set(0, 0.22, 0); lastSeg.add(seg); }
                    this.tailSegments.push(seg); lastSeg = seg;
                }
                this.mesh.add(this.tailGroup);
            }

            update(delta) {
                this.animTime += delta * 0.003 * config.flapSpeed;
                const t = this.animTime;
                
                if (t > this.changeTargetTime) {
                    const angle = Math.atan2(this.direction.x, this.direction.z) + (Math.random()-0.5)*Math.PI*0.5;
                    this.targetDirection.set(Math.sin(angle), (Math.random()-0.5)*0.1, Math.cos(angle)).normalize();
                    this.changeTargetTime = t + 10 + Math.random()*20;
                }
                if (this.group.position.y < 10) this.targetDirection.y += 0.02;
                if (this.group.position.y > 60) this.targetDirection.y -= 0.02;
                if (new THREE.Vector2(this.group.position.x, this.group.position.z).length() > config.bounds) {
                    const toCenter = new THREE.Vector3().copy(this.group.position).negate().normalize();
                    this.targetDirection.lerp(toCenter, 0.02).normalize();
                }

                const lastY = this.group.rotation.y;
                const dummy = new THREE.Object3D();
                dummy.position.copy(this.group.position);
                dummy.lookAt(new THREE.Vector3().copy(this.group.position).add(this.targetDirection));
                this.group.quaternion.rotateTowards(dummy.quaternion, config.turnSpeed);
                
                let turnDiff = this.group.rotation.y - lastY;
                if (turnDiff > Math.PI) turnDiff -= Math.PI*2; if (turnDiff < -Math.PI) turnDiff += Math.PI*2;
                this.currentRoll = THREE.MathUtils.lerp(this.currentRoll, -turnDiff*30, 0.05);
                this.mesh.rotation.y = this.currentRoll; 
                this.group.translateZ(this.moveSpeed);

                const posAttr = this.mesh.geometry.attributes.position;
                for (let i = 0; i < posAttr.count; i++) {
                    const x = this.initialPositions[i*3], y = this.initialPositions[i*3+1], pz = this.initialPositions[i*3+2];
                    const d = Math.abs(x);
                    const wave = Math.sin(t + d*2.0 - y*0.5) * 0.3 * (d <= 0.4 ? d*0.1 : (d-0.4)*1.1) * config.flapStrength;
                    posAttr.setZ(i, pz + wave);
                }
                posAttr.needsUpdate = true;
                const sZ = (config.bodyDepth * (1.0 - (config.eyeX / 2.7 * config.wingTaper))) + 0.1;
                const getW = (x, y) => { const d = Math.abs(x); return Math.sin(t + d*2.0 - y*0.5)*0.3*(d<=0.4?d*0.1:(d-0.4)*1.1)*config.flapStrength; };
                this.eyeL.position.set(-config.eyeX, -config.eyeY, sZ + config.eyeHover + getW(-config.eyeX, -config.eyeY));
                this.eyeR.position.set(config.eyeX, -config.eyeY, sZ + config.eyeHover + getW(config.eyeX, -config.eyeY));
                this.tailSegments.forEach((seg, i) => {
                    seg.rotation.z = Math.sin(t*0.8/config.flapSpeed - i*0.15)*0.18;
                    seg.rotation.x = Math.cos(t*0.8/config.flapSpeed - i*0.15)*0.12;
                });
            }
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color('#000308');
            scene.fog = new THREE.FogExp2('#00050a', 0.012);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 5, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            darkTexture = createPolimaxxTexture(config.darkBase, false);
            lightTexture = createPolimaxxTexture(config.lightBase, true);

            sharedMaterial = new THREE.MeshStandardMaterial({ 
                map: darkTexture, roughness: 0.3, metalness: 0.1,
                emissive: new THREE.Color(config.darkBase), emissiveIntensity: 0.15
            });
            eyeMaterial = new THREE.MeshPhongMaterial({ color: config.eyeColor, emissive: config.eyeColor, emissiveIntensity: 2.5, shininess: 100 });
            tailMaterial = new THREE.MeshStandardMaterial({ color: config.tailColor, emissive: config.tailColor, emissiveIntensity: 1.2 });

            ambientLight = new THREE.AmbientLight(0xffffff, 0.1); 
            scene.add(ambientLight);
            hemiLight = new THREE.HemisphereLight(0x4488ff, 0x000205, 0.6);
            scene.add(hemiLight);
            spotLight = new THREE.SpotLight(0xffffff, 12, 300, Math.PI/6, 0.3, 1.2);
            spotLight.position.set(0, 120, 0);
            scene.add(spotLight);
            sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(50, 100, 50);
            sunLight.visible = false;
            scene.add(sunLight);

            const pGeo = new THREE.BufferGeometry();
            const pPos = [];
            for (let i = 0; i < config.particleCount; i++) {
                pPos.push((Math.random() - 0.5) * 300, (Math.random() - 0.5) * 200, (Math.random() - 0.5) * 300);
            }
            pGeo.setAttribute('position', new THREE.Float32BufferAttribute(pPos, 3));
            marineSnow = new THREE.Points(pGeo, new THREE.PointsMaterial({ color: 0x88ccff, size: 0.18, transparent: true, opacity: 0.5 }));
            scene.add(marineSnow);

            floorMaterial = new THREE.MeshStandardMaterial({ color: 0x010205, roughness: 1 });
            const floor = new THREE.Mesh(new THREE.PlaneBufferGeometry(2000, 2000), floorMaterial);
            floor.rotation.x = -Math.PI / 2; floor.position.y = -50;
            scene.add(floor);

            composer = new THREE.EffectComposer(renderer);
            composer.addPass(new THREE.RenderPass(scene, camera));
            bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.4, 0.3);
            composer.addPass(bloomPass);

            for (let i = 0; i < config.count; i++) rayInstances.push(new Stingray());

            // Listeners
            document.getElementById('modeToggle').addEventListener('click', toggleMode);
            window.addEventListener('resize', onResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('wheel', onWheel, { passive: false });
            
            // Touch Events
            window.addEventListener('touchstart', onTouchStart, { passive: false });
            window.addEventListener('touchmove', onTouchMove, { passive: false });
            window.addEventListener('touchend', onTouchEnd);

            requestAnimationFrame(animate);
        }

        function toggleMode() {
            isDarkMode = !isDarkMode;
            const btn = document.getElementById('modeToggle');
            const body = document.body;
            if (isDarkMode) {
                body.classList.remove('daylight-active');
                scene.background.set('#000308'); scene.fog.color.set('#00050a'); scene.fog.density = 0.012;
                ambientLight.intensity = 0.1; hemiLight.intensity = 0.6; sunLight.visible = false; spotLight.visible = true;
                marineSnow.visible = true; sharedMaterial.map = darkTexture; sharedMaterial.emissive.set(config.darkBase);
                sharedMaterial.emissiveIntensity = 0.15; floorMaterial.color.set('#010205'); bloomPass.strength = 1.2;
                btn.innerText = "SWITCH TO SUNNY OCEAN";
            } else {
                body.classList.add('daylight-active');
                scene.background.set('#0096c7'); scene.fog.color.set('#0096c7'); scene.fog.density = 0.003; 
                ambientLight.intensity = 0.7; hemiLight.intensity = 0.4; sunLight.visible = true; spotLight.visible = false;
                marineSnow.visible = false; sharedMaterial.map = lightTexture; sharedMaterial.emissive.set(config.lightBase);
                sharedMaterial.emissiveIntensity = 0.02; floorMaterial.color.set('#7eb8d1'); bloomPass.strength = 0.1;
                btn.innerText = "SWITCH TO DEEP SEA";
            }
            sharedMaterial.needsUpdate = true;
        }

        function onMouseMove(e) {
            if (!isTouching) {
                targetRotation.x = (e.clientX / window.innerWidth) * 2 - 1;
                targetRotation.y = -(e.clientY / window.innerHeight) * 2 + 1;
            }
        }

        function onWheel(e) {
            e.preventDefault();
            targetZoom += e.deltaY * 0.05;
            targetZoom = Math.max(40, Math.min(180, targetZoom));
        }

        function onTouchStart(e) {
            isTouching = true;
            if (e.touches.length === 1) {
                lastTouchPos.set(e.touches[0].pageX, e.touches[0].pageY);
            } else if (e.touches.length === 2) {
                touchStartDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            }
        }

        function onTouchMove(e) {
            e.preventDefault();
            if (e.touches.length === 1) {
                const deltaX = e.touches[0].pageX - lastTouchPos.x;
                const deltaY = e.touches[0].pageY - lastTouchPos.y;
                targetRotation.x += deltaX * 0.005;
                targetRotation.y -= deltaY * 0.005;
                lastTouchPos.set(e.touches[0].pageX, e.touches[0].pageY);
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                const delta = touchStartDist - dist;
                targetZoom += delta * 0.2;
                targetZoom = Math.max(40, Math.min(180, targetZoom));
                touchStartDist = dist;
            }
        }

        function onTouchEnd() {
            isTouching = false;
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(timestamp) {
            const delta = timestamp - (lastTimestamp || timestamp);
            lastTimestamp = timestamp;

            rayInstances.forEach(ray => ray.update(delta));
            if (isDarkMode) {
                marineSnow.position.y -= 0.04;
                if (marineSnow.position.y < -70) marineSnow.position.y = 70;
            }

            // Smooth Movement
            currentRotation.x += (targetRotation.x - currentRotation.x) * 0.05;
            currentRotation.y += (targetRotation.y - currentRotation.y) * 0.05;
            currentZoom += (targetZoom - currentZoom) * 0.05;

            camera.position.x = Math.sin(currentRotation.x * 0.8) * currentZoom;
            camera.position.z = Math.cos(currentRotation.x * 0.8) * currentZoom;
            camera.position.y = 5 + currentRotation.y * 30;
            camera.lookAt(0, 20, 0);

            if (isDarkMode) {
                spotLight.position.x = currentRotation.x * 60;
                spotLight.target.position.x = currentRotation.x * 80;
                spotLight.target.position.z = -currentRotation.y * 50;
            }

            composer.render();
            requestAnimationFrame(animate);
        }

        window.onload = init;
    </script>
</body>
</html>
