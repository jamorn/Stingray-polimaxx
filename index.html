<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Stingray Swarm - Polimaxx Interactive</title>
    <style>
        body { 
            margin: 0; 
            background: #00050a; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas { display: block; outline: none; }
        .lil-gui { --width: 300px; }

        #mode-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        #mode-toggle.daylight-ui {
            background: rgba(255, 255, 255, 0.7);
            color: #0e3a66; 
            border: 1px solid rgba(14, 58, 102, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        #mode-toggle:hover {
            transform: translateY(-2px);
            background: rgba(0, 0, 0, 0.6);
        }
        #mode-toggle.daylight-ui:hover {
            background: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body>

    <button id="mode-toggle">
        <span id="mode-icon">🌙</span>
        <span id="mode-text">Dark Mode</span>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.umd.min.js"></script>

    <script>
        // ============================================================
        // Kiosk configuration — tweak here if needed
        // ============================================================
        const KIOSK = {
            // Roll animTime / tailTime back down once they exceed this value.
            // They are folded modulo 2π (not modulo some arbitrary period), so
            // the oscillator phase is preserved EXACTLY for any frequency.
            // This is what keeps the wing AND the tail continuous across the
            // rollover without depending on the current flapSpeed.
            animResetThreshold: 1e6,
            // Auto-reload the page after this many milliseconds. Guard against
            // slow memory growth / precision drift over weeks of uptime.
            reloadAfterMs: 24 * 60 * 60 * 1000,   // 24 hours
            // Log JS heap usage to console every hour (no-op if unsupported).
            memoryLogIntervalMs: 60 * 60 * 1000,  // 1 hour
            enableAutoReload: true,
            enableMemoryLog: true
        };
        const TWO_PI = Math.PI * 2;

        // Fold a time accumulator back into [0, 2π) once it grows too large.
        // sin(x) and cos(x) are 2π-periodic, so this is a pure phase-preserving
        // operation regardless of how the accumulator is later scaled (e.g.
        // the tail uses tailTime directly, the wing uses animTime directly).
        // Assumes time >= 0 (always true here: accumulators start positive and
        // only ever increase). A negative input would early-return unchanged.
        function foldPhase(time) {
            if (time <= KIOSK.animResetThreshold) return time;
            return time - TWO_PI * Math.floor(time / TWO_PI);
        }

        const config = {
            count: 15, 
            bounds: 80,
            minSpeed: 0.12,
            maxSpeed: 0.2,
            turnSpeed: 0.012, 
            flapStrength: 0.6,
            flapSpeed: 0.75,
            eyeHover: 0.08,
            eyeX: 0.45,
            eyeY: 1.50, 
            bodyDepth: 0.45, 
            wingTaper: 0.15, 
            baseColor: '#ef0101', 
            eyeColor: '#3928b8',  
            tailColor: '#0e5167',
            timeScale: 1.0,
            tailOffsetZ: 0.48,
            bloomStrength: 1.5,
            bloomRadius: 0.4,
            bloomThreshold: 0.21,
            separationDist: 15,
            separationForce: 0.05,
            // ---- Bat echolocation ----
            enableBatEcholocation: true,
            echolocationConeAngle: Math.PI / 3,
            echolocationRange: 30,
            echolocationStrength: 0.08,
            showEchoCones: false
        };

        const envSettings = {
            background: '#000810',
            ambientIntensity: 1.0,
            sunIntensity: 0.8,
            rimIntensity: 1.5,
            fogNear: 40,
            fogFar: 370,
            showGrid: true,
            preset: 'Dark'
        };

        const PRESETS = {
            Dark: {
                background: '#000810',
                ambientIntensity: 1.0,
                sunIntensity: 0.8,
                rimIntensity: 1.5,
                fogNear: 40,
                fogFar: 370,
                bloom: 1.5,
                eyeEmissive: 2.0,
                tailEmissive: 1.5
            },
            Daylight: {
                background: '#88ccff',
                ambientIntensity: 1.6,
                sunIntensity: 1.2,
                rimIntensity: 0.6,
                fogNear: 100,
                fogFar: 500,
                bloom: 0.2,
                eyeEmissive: 0.4,
                tailEmissive: 0.2
            }
        };

        // ============================================================
        // Scratch vectors reused every frame to avoid per-frame
        // allocations (GC pressure). Shared across Stingray instances is
        // safe because update() is called sequentially (no reentrancy).
        // ============================================================
        const _sepVec     = new THREE.Vector3();
        const _diff       = new THREE.Vector3();
        const _lookTarget = new THREE.Vector3();
        const _dummy      = new THREE.Object3D();
        const _forward    = new THREE.Vector3();
        const _cross      = new THREE.Vector3();
        const _avoidDir   = new THREE.Vector3();
        const _diffDir    = new THREE.Vector3();

        // ============================================================
        // Shared TEMPLATE geometries.
        // SHARED_TAIL_GEO is a template only — each Stingray clones it
        // because tail vertices are animated per-instance. Sharing the
        // animated geometry would cause every tail to fight over the same
        // vertex buffer. SHARED_EYE_GEO is safe to share because eye
        // vertices are static.
        // ============================================================
        const SHARED_EYE_GEO  = new THREE.SphereGeometry(0.12, 16, 16);
        const SHARED_TAIL_GEO = new THREE.ConeGeometry(0.06, 4.0, 8, 12);
        SHARED_TAIL_GEO.translate(0, (4.0 / 2 + 1.8), 0);

        let scene, camera, renderer, composer, bloomPass, rayInstances = [];
        let ambientLight, sunLight, rimLight, gridHelper;
        let sharedMaterial, eyeMaterial, tailMaterial; 
        let isPaused = false;
        let pointerPos = { x: 0, y: 0 };
        let orbitRotation = { x: 0.2, y: 0 };
        let zoom = 110; 
        let lastTimestamp = 0;
        let gui;
        let pauseController = null;

        const viewSettings = {
            orbitX: orbitRotation.x,
            orbitY: orbitRotation.y,
            zoom: zoom,
            fogNear: envSettings.fogNear,
            fogFar: envSettings.fogFar
        };

        let initialPinchDist = 0;
        let initialZoom = 0;

        let _guiSyncScheduled = false;
        function scheduleGuiSync() {
            if (_guiSyncScheduled || !gui) return;
            _guiSyncScheduled = true;
            requestAnimationFrame(() => {
                _guiSyncScheduled = false;
                if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
            });
        }

        function getBrightness(hexColor) {
            const rgb = parseInt(hexColor.replace('#', ''), 16);
            const r = (rgb >> 16) & 0xff;
            const g = (rgb >> 8) & 0xff;
            const b = (rgb >> 0) & 0xff;
            return (r * 299 + g * 587 + b * 114) / 1000;
        }

        function createPolimaxxTexture(color = '#ffffff') {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            const brightness = getBrightness(color);
            const brandBlue = '#0e3a66', brandOrange = '#f37021';
            const textColor = brightness > 140 ? brandBlue : '#ffffff';

            ctx.fillStyle = color; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = brandOrange; ctx.fillRect(0, 0, 2048, 60); 
            ctx.fillStyle = brandBlue; ctx.fillRect(0, 964, 2048, 60);
            
            const drawLogoSet = (offsetX, isMirror = false) => {
                ctx.save();
                ctx.translate(offsetX + 512, 512);
                if (isMirror) ctx.scale(-1, 1);
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 10;
                ctx.fillStyle = textColor; ctx.font = 'bold 44px Arial'; ctx.fillText('POLIMAXX', 0, -145);
                ctx.fillStyle = brandOrange; ctx.font = '900 220px Arial'; ctx.fillText('PP', 0, -10);
                ctx.fillStyle = textColor; ctx.font = 'bold 38px Arial'; ctx.fillText('POLYETHYLENE', 0, 105);
                ctx.fillStyle = brandOrange;
                ctx.font = "900 56px Arial";
                ctx.fillText("IRPC", 0, 178);
                ctx.restore();
            };
            drawLogoSet(0, false); drawLogoSet(1024, true); 
            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        class Stingray {
            constructor() {
                this.group = new THREE.Group();
                this.animTime = Math.random() * 100;
                // Separate phase accumulator for the tail oscillator. The tail
                // wave is sin(tailTime - const), i.e. frequency baked into the
                // accumulator's rate rather than multiplying a shared t. That
                // makes the phase independent of flapSpeed, so folding it mod
                // 2π never causes a visual jump.
                this.tailTime = Math.random() * 100;
                
                const rand = Math.random();
                let scale;
                if (rand > 0.92) scale = 4.5 + Math.random() * 2.0; 
                else if (rand > 0.75) scale = 2.5 + Math.random() * 1.5; 
                else scale = 0.8 + Math.random() * 0.8; 

                this.scale = scale;
                this.group.scale.set(scale, scale, scale);
                this.radius = scale * 2.5;

                const baseSpeed = config.minSpeed + Math.random() * (config.maxSpeed - config.minSpeed);
                this.moveSpeed = scale > 3 ? baseSpeed * 0.5 : baseSpeed;

                const spawn = config.bounds * 0.7;
                const angle = Math.random() * Math.PI * 2;
                this.direction = new THREE.Vector3(Math.cos(angle), (Math.random()-0.5)*0.1, Math.sin(angle)).normalize();
                this.targetDirection = this.direction.clone();
                this.group.position.set((Math.random()-0.5)*2*spawn, (Math.random()-0.5)*50, (Math.random()-0.5)*2*spawn);
                this.changeTargetTime = 0;
                this.currentRoll = 0; 
                this.echoCone = null;
                this.initMesh();
                scene.add(this.group);
            }

            initMesh() {
                const shape = new THREE.Shape();
                shape.moveTo(0, -1.8); 
                shape.bezierCurveTo(1.7, -1.6, 3.2, -0.8, 3.2, 0); 
                shape.bezierCurveTo(3.2, 0.8, 1.4, 1.6, 0, 1.8); 
                shape.bezierCurveTo(-1.4, 1.6, -3.2, 0.8, -3.2, 0); 
                shape.bezierCurveTo(-3.2, -0.8, -1.7, -1.6, 0, -1.8);

                const geometry = new THREE.ExtrudeGeometry(shape, { 
                    depth: config.bodyDepth, 
                    bevelEnabled: true, 
                    bevelThickness: 0.15, 
                    bevelSize: 0.3, 
                    bevelSegments: 15 
                });

                const pos = geometry.attributes.position;
                const uvs = geometry.attributes.uv;

                for (let i = 0; i < pos.count; i++) {
                    const x = pos.getX(i);
                    const y = pos.getY(i);
                    const z = pos.getZ(i);
                    
                    const distFromCenter = Math.abs(x) / 3.2; 
                    const taperFactor = THREE.MathUtils.lerp(1.0, config.wingTaper, distFromCenter);
                    
                    const centeredZ = z - (config.bodyDepth / 2);
                    pos.setZ(i, (centeredZ * taperFactor) + (config.bodyDepth / 2));

                    if (z >= config.bodyDepth - 0.05) {
                        uvs.setXY(i, (-x / 6.4 * 0.45) + 0.25, (-y / 3.6 * 0.45) + 0.5);
                    } else if (z <= 0.05) {
                        uvs.setXY(i, (-x / 6.4 * 0.45) + 0.75, (-y / 3.6 * 0.45) + 0.5);
                    } else {
                        uvs.setXY(i, 0.5, (z > config.bodyDepth / 2) ? 0.03 : 0.97);
                    }
                }
                
                this.initialPositions = new Float32Array(pos.array);
                this.mesh = new THREE.Mesh(geometry, sharedMaterial);
                this.mesh.rotation.x = -Math.PI / 2; 
                this.group.add(this.mesh);

                this.eyeL = new THREE.Mesh(SHARED_EYE_GEO, eyeMaterial); 
                this.eyeR = new THREE.Mesh(SHARED_EYE_GEO, eyeMaterial);
                
                const eyeDistFromCenter = config.eyeX / 3.2;
                const eyeTaperFactor = THREE.MathUtils.lerp(1.0, config.wingTaper, eyeDistFromCenter);
                this.eyeZPos = (config.bodyDepth / 2) * eyeTaperFactor; 

                this.mesh.add(this.eyeL, this.eyeR);

                geometry.computeBoundingBox();
                const bb = geometry.boundingBox;
                const bodyCenterY_local = (bb.min.y + bb.max.y) * 0.5;
                const surfaceZ_local = (config.bodyDepth / 2) + this.eyeZPos;
                // Pick the body face farthest from the top surface = the back.
                const bodyBackZ_local = (Math.abs(bb.min.z - surfaceZ_local) > Math.abs(bb.max.z - surfaceZ_local)) ? bb.min.z : bb.max.z;

                this.tailLen = 4.0;
                // Clone FIRST, then read tailInitPos from the clone so the
                // initial positions always match this instance's geometry, even
                // if the shared template is mutated later.
                this.tailMesh = new THREE.Mesh(SHARED_TAIL_GEO.clone(), tailMaterial);
                this.tailInitPos = new Float32Array(this.tailMesh.geometry.attributes.position.array);
                this.mesh.add(this.tailMesh);
                this.tailMesh.position.set(0, bodyCenterY_local, bodyBackZ_local + config.tailOffsetZ);

                this.initEchoCone();
            }

            initEchoCone() {
                const range = config.echolocationRange;
                const radius = Math.tan(config.echolocationConeAngle) * range;
                const geo = new THREE.ConeGeometry(radius, range, 24, 1, true);
                const mat = new THREE.MeshBasicMaterial({
                    color: 0x00ff88, transparent: true, opacity: 0.06,
                    wireframe: true, depthWrite: false
                });
                this.echoCone = new THREE.Mesh(geo, mat);
                this.echoCone.rotation.x = -Math.PI / 2;
                this.echoCone.rotation.z = Math.PI;
                this.echoCone.position.set(0, 0, range / 2);
                this.echoCone.visible = config.showEchoCones;
                this.mesh.add(this.echoCone);
            }

            setEchoConeVisible(v) {
                if (this.echoCone) this.echoCone.visible = v;
            }

            /**
             * Flap wave Z-offset for a given local (x, y) on the wing surface.
             * Pure function of |x|, so left/right eyes stay mirrored.
             * Kept as two separate calls in update() for future-proofing
             * against asymmetric wing tilts.
             */
            getFlapWave(x, y, t) {
                const d = Math.abs(x);
                return Math.sin(t + d * 1.8 - y * 0.5) * 0.35
                     * (d <= 0.4 ? d * 0.1 : (d - 0.4) * 1.2)
                     * config.flapStrength;
            }

            update(delta, allRays) {
                // Base angular step shared by both oscillators (radians/frame).
                const dPhase = delta * 0.003 * config.flapSpeed * config.timeScale;
                this.animTime += dPhase;
                // Tail runs at its own rate = base * tailFreq. Folding the
                // ACCUMULATOR (not t*tailFreq) keeps the phase exact for any
                // flapSpeed, since tailTime itself is the sine's argument.
                this.tailTime += dPhase * (1 + config.flapSpeed * 2.2);

                // Kiosk guard: keep accumulators small so Math.sin() stays at
                // full float64 precision over weeks of uptime. Folding modulo
                // 2π is phase-preserving for every oscillator frequency.
                if (this.animTime > KIOSK.animResetThreshold) {
                    this.animTime = foldPhase(this.animTime);
                    // Re-arm the wander timer in the new time domain, otherwise
                    // it sits far ahead of the reset animTime and never triggers
                    // again (rays would fly a single heading for days).
                    this.changeTargetTime = this.animTime + 10 + Math.random() * 20;
                }
                this.tailTime = foldPhase(this.tailTime);

                const t = this.animTime;

                if (t > this.changeTargetTime) {
                    const angle = Math.atan2(this.targetDirection.x, this.targetDirection.z) + (Math.random()-0.5)*Math.PI*0.5;
                    this.targetDirection.set(Math.sin(angle), (Math.random()-0.5)*0.2, Math.cos(angle)).normalize();
                    this.changeTargetTime = t + 10 + Math.random()*20;
                }

                // ---- Separation (omni-directional, close-range fallback) ----
                _sepVec.set(0, 0, 0);
                let count = 0;
                const myPos = this.group.position;
                for (let i = 0; i < allRays.length; i++) {
                    const other = allRays[i];
                    if (other === this) continue;
                    _diff.subVectors(myPos, other.group.position);
                    const distSq = _diff.lengthSq();
                    const minDist = this.radius + other.radius + config.separationDist;
                    if (distSq < minDist * minDist) {
                        const dist = Math.sqrt(distSq);
                        _diff.divideScalar(Math.max(0.1, dist * dist));
                        _sepVec.add(_diff);
                        count++;
                    }
                }
                if (count > 0) {
                    _sepVec.divideScalar(count);
                    this.targetDirection.add(_sepVec.multiplyScalar(config.separationForce)).normalize();
                }

                // ---- Bat echolocation (forward-sensing reciprocal avoidance) ----
                if (config.enableBatEcholocation) this.applyEcholocation(allRays, myPos);

                // ---- Bounds ----
                if (myPos.length() > config.bounds) {
                    _lookTarget.copy(myPos).negate().normalize();
                    this.targetDirection.lerp(_lookTarget, 0.02).normalize();
                }

                // ---- Orientation ----
                const lastY = this.group.rotation.y;
                _dummy.position.copy(myPos);
                _lookTarget.copy(myPos).add(this.targetDirection);
                _dummy.lookAt(_lookTarget);
                this.group.quaternion.rotateTowards(_dummy.quaternion, config.turnSpeed);
                
                let turnDiff = this.group.rotation.y - lastY;
                if (turnDiff > Math.PI) turnDiff -= Math.PI*2; if (turnDiff < -Math.PI) turnDiff += Math.PI*2;
                const rollK = 1 - Math.pow(0.95, delta / 16.67);
                this.currentRoll = THREE.MathUtils.lerp(this.currentRoll, -turnDiff*30, rollK);
                this.mesh.rotation.y = this.currentRoll; 

                this.direction.copy(this.targetDirection);

                // Speed in per-second units, identical at 60fps.
                this.group.translateZ(this.moveSpeed * delta * 0.06);

                // ---- Wing flap ----
                const posAttr = this.mesh.geometry.attributes.position;
                if (config.flapStrength > 0.001) {
                    for (let i = 0; i < posAttr.count; i++) {
                        const x = this.initialPositions[i*3], y = this.initialPositions[i*3+1], pz = this.initialPositions[i*3+2];
                        const d = Math.abs(x);
                        const flapAmp = (d <= 0.4 ? d*0.1 : (d-0.4)*1.2);
                        const wave = Math.sin(t + d*1.8 - y*0.5) * 0.35 * flapAmp * config.flapStrength;
                        posAttr.setZ(i, pz + wave);
                    }
                    posAttr.needsUpdate = true;
                }
                
                // ---- Eyes ----
                const surfaceZ = (config.bodyDepth / 2) + this.eyeZPos;
                this.eyeL.position.set(
                    -config.eyeX, -config.eyeY,
                    surfaceZ + config.eyeHover + this.getFlapWave(-config.eyeX, -config.eyeY, t)
                );
                this.eyeR.position.set(
                     config.eyeX, -config.eyeY,
                    surfaceZ + config.eyeHover + this.getFlapWave( config.eyeX, -config.eyeY, t)
                );
                
                // ---- Tail (per-instance cloned geometry) ----
                if (this.tailMesh && this.tailInitPos && config.flapStrength > 0.001) {
                    const tailAttr = this.tailMesh.geometry.attributes.position;
                    for (let vi = 0; vi < tailAttr.count; vi++) {
                        const bx = this.tailInitPos[vi*3], by = this.tailInitPos[vi*3+1];
                        const vt = Math.max(0, (by - 1.8) / this.tailLen);
                        const amp = vt * vt;
                        // tailTime already carries the tail's frequency, so the
                        // phase stays continuous across a mod-2π fold for any
                        // flapSpeed (previously: t * (1 + flapSpeed*2.2)).
                        const wave = Math.sin(this.tailTime - vt * 6.0) * 0.55 * amp * config.flapStrength;
                        tailAttr.setX(vi, bx + wave);
                    }
                    tailAttr.needsUpdate = true;
                }
            }

            /**
             * Forward-sensing reciprocal avoidance modelled on bat echolocation.
             *
             * Uses `targetDirection` (the live steering heading) instead of the
             * group quaternion, so detection reacts to the *intended* heading
             * rather than the lagged visual orientation.
             *
             * Side convention (Y-up right-handed):
             *   cross(forward, toOther).y > 0  => neighbour to the LEFT  => steer RIGHT
             *   cross(forward, toOther).y < 0  => neighbour to the RIGHT => steer LEFT
             * Near-coplanar tie-break falls back to comparing x offsets.
             */
            applyEcholocation(allRays, myPos) {
                _forward.copy(this.targetDirection).normalize();
                const cosLimit = Math.cos(config.echolocationConeAngle);
                let steerX = 0, steerZ = 0;

                for (let i = 0; i < allRays.length; i++) {
                    const other = allRays[i];
                    if (other === this) continue;

                    _diffDir.subVectors(other.group.position, myPos);
                    const dist = _diffDir.length();
                    if (dist < 0.001 || dist > config.echolocationRange) continue;

                    _diffDir.multiplyScalar(1 / dist);
                    const cosAngle = _forward.dot(_diffDir);
                    if (cosAngle < cosLimit) continue;

                    _cross.crossVectors(_forward, _diffDir);
                    let side;
                    if (Math.abs(_cross.y) < 1e-4) {
                        side = (other.group.position.x >= myPos.x) ? -1 : 1;
                    } else {
                        side = (_cross.y > 0) ? 1 : -1;
                    }

                    _avoidDir.set(-_diffDir.z, 0, _diffDir.x);
                    if (_avoidDir.lengthSq() < 1e-6) continue;
                    _avoidDir.normalize().multiplyScalar(side);

                    const urgency = 1 - (dist / config.echolocationRange);
                    const w = config.echolocationStrength * urgency * urgency;
                    steerX += _avoidDir.x * w;
                    steerZ += _avoidDir.z * w;
                }

                if (steerX !== 0 || steerZ !== 0) {
                    this.targetDirection.x += steerX;
                    this.targetDirection.z += steerZ;
                    // Re-normalize while preserving the vertical component, so
                    // steering never silently biases the ray toward y=0.
                    const yClamped = THREE.MathUtils.clamp(this.targetDirection.y, -0.99, 0.99);
                    const targetLenXZ = Math.sqrt(1 - yClamped * yClamped);
                    const lenXZ = Math.hypot(this.targetDirection.x, this.targetDirection.z);
                    if (lenXZ > 1e-6) {
                        const k = targetLenXZ / lenXZ;
                        this.targetDirection.x *= k;
                        this.targetDirection.z *= k;
                        this.targetDirection.y = yClamped;
                    }
                }
            }
        }

        function updateGridColor(preset) {
            if (gridHelper) {
                scene.remove(gridHelper);
                gridHelper.geometry.dispose();
                gridHelper.material.dispose();
            }
            const gridColor = (preset === 'Dark') ? 0x00ffff : 0x004488;
            gridHelper = new THREE.GridHelper(500, 50, gridColor, gridColor);
            gridHelper.position.y = -100;
            if(envSettings.showGrid) scene.add(gridHelper);
        }

        function applyPreset(v) {
            const btn = document.getElementById('mode-toggle');
            const p = PRESETS[v] || PRESETS.Dark;

            envSettings.background = p.background;
            envSettings.ambientIntensity = p.ambientIntensity;
            envSettings.sunIntensity = p.sunIntensity;
            envSettings.rimIntensity = p.rimIntensity;
            envSettings.fogNear = p.fogNear;
            envSettings.fogFar = p.fogFar;

            bloomPass.strength = p.bloom;
            eyeMaterial.emissiveIntensity = p.eyeEmissive;
            tailMaterial.emissiveIntensity = p.tailEmissive;

            if (v === 'Daylight') {
                document.getElementById('mode-text').innerText = 'Daylight Mode';
                document.getElementById('mode-icon').innerText = '☀️';
                btn.classList.add('daylight-ui');
            } else {
                document.getElementById('mode-text').innerText = 'Dark Mode';
                document.getElementById('mode-icon').innerText = '🌙';
                btn.classList.remove('daylight-ui');
            }

            updateGridColor(v);
            scene.background.set(envSettings.background);
            scene.fog.color.set(envSettings.background);
            scene.fog.near = envSettings.fogNear;
            scene.fog.far = envSettings.fogFar;
            ambientLight.intensity = envSettings.ambientIntensity;
            sunLight.intensity = envSettings.sunIntensity;
            rimLight.intensity = envSettings.rimIntensity;
            viewSettings.fogNear = envSettings.fogNear;
            viewSettings.fogFar = envSettings.fogFar;
            if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
        }

        // Dispose per-instance GPU resources. Shared materials and
        // SHARED_EYE_GEO are NOT disposed here. tailMesh.geometry IS
        // per-instance (cloned) so it must be freed.
        function disposeRay(r) {
            scene.remove(r.group);
            if (r.mesh && r.mesh.geometry) r.mesh.geometry.dispose();
            if (r.tailMesh && r.tailMesh.geometry) r.tailMesh.geometry.dispose();
            if (r.echoCone) {
                r.echoCone.geometry.dispose();
                r.echoCone.material.dispose();
            }
        }

        function rebuildRays() {
            rayInstances.forEach(disposeRay);
            rayInstances = [];
            for (let i = 0; i < config.count; i++) rayInstances.push(new Stingray());
        }

        function setPauseLabel() {
            if (pauseController) pauseController.name(isPaused ? 'Resume (Space)' : 'Pause (Space)');
        }

        function initGUI() {
            if (gui) gui.destroy();
            gui = new lil.GUI({ title: 'Polimaxx Stingray Swarm' });
            
            const envFolder = gui.addFolder('Environment Settings');
            envFolder.add(envSettings, 'preset', ['Dark', 'Daylight']).name('Mode Preset').onChange(applyPreset);

            const camFolder = gui.addFolder('Camera & Fog');
            camFolder.add(viewSettings, 'orbitX', -Math.PI/2 + 0.1, Math.PI/2 - 0.1, 0.01)
                .name('Camera Pitch')
                .onChange(v => { orbitRotation.x = v; updateCamera(); });
            camFolder.add(viewSettings, 'orbitY', -Math.PI, Math.PI, 0.01)
                .name('Camera Yaw')
                .onChange(v => { orbitRotation.y = v; updateCamera(); });
            camFolder.add(viewSettings, 'zoom', 30, 600, 1)
                .name('Zoom')
                .onChange(v => { zoom = v; updateCamera(); });
            camFolder.add(viewSettings, 'fogNear', 0, 300, 1)
                .name('Fog Near')
                .onChange(v => {
                    const near = Math.min(v, envSettings.fogFar - 1);
                    envSettings.fogNear = near;
                    viewSettings.fogNear = near;
                    if (scene && scene.fog) scene.fog.near = near;
                    if (near !== v) scheduleGuiSync();
                });
            camFolder.add(viewSettings, 'fogFar', 50, 800, 1)
                .name('Fog Far')
                .onChange(v => {
                    const far = Math.max(v, envSettings.fogNear + 1);
                    envSettings.fogFar = far;
                    viewSettings.fogFar = far;
                    if (scene && scene.fog) scene.fog.far = far;
                    if (far !== v) scheduleGuiSync();
                });

            const motionFolder = gui.addFolder('Stingray Motion');
            motionFolder.add(config, 'flapSpeed', 0.1, 2.0).name('Flap Speed');
            motionFolder.add(config, 'flapStrength', 0.1, 2.0).name('Flap Strength');

            const echoFolder = gui.addFolder('Bat Echolocation');
            echoFolder.add(config, 'enableBatEcholocation').name('Enable');
            echoFolder.add(config, 'echolocationConeAngle', 0.15, Math.PI).name('Cone Angle (rad)');
            echoFolder.add(config, 'echolocationRange', 5, 80).name('Detection Range');
            echoFolder.add(config, 'echolocationStrength', 0, 0.3, 0.001).name('Avoid Strength');
            echoFolder.add(config, 'showEchoCones').name('Show Cones').onChange(v => {
                rayInstances.forEach(r => r.setEchoConeVisible(v));
            });

            const bodyFolder = gui.addFolder('Body Structure');
            bodyFolder.add(config, 'bodyDepth', 0.1, 1.0).name('Center Thickness').onFinishChange(rebuildRays);
            bodyFolder.add(config, 'wingTaper', 0.05, 1.0).name('Wing Taper (Slope)').onFinishChange(rebuildRays);

            const colorFolder = gui.addFolder('Stingray Appearance');
            colorFolder.addColor(config, 'baseColor').name('Body Color').onFinishChange(v => {
                sharedMaterial.map.dispose(); sharedMaterial.map = createPolimaxxTexture(v);
            });
            colorFolder.addColor(config, 'eyeColor').name('Eye Color').onChange(v => {
                eyeMaterial.color.set(v); eyeMaterial.emissive.set(v);
            });

            gui.add(config, 'timeScale', 0, 2, 0.01).name('Playback Speed');
            const pauseControl = { togglePause: () => { isPaused = !isPaused; setPauseLabel(); scheduleGuiSync(); } };
            pauseController = gui.add(pauseControl, 'togglePause').name(isPaused ? 'Resume (Space)' : 'Pause (Space)');

            gui.close();
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(envSettings.background);
            scene.fog = new THREE.Fog(envSettings.background, envSettings.fogNear, envSettings.fogFar);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // ============================================================
            // Kiosk: handle WebGL context loss (GPU reset, driver update,
            // memory pressure). Without this the canvas can freeze silently
            // for hours. Reloading the page is the safest recovery.
            // ============================================================
            renderer.domElement.addEventListener('webglcontextlost', (e) => {
                e.preventDefault();
                console.warn('[Kiosk] WebGL context lost — reloading page in 2s');
                setTimeout(() => location.reload(), 2000);
            });
            renderer.domElement.addEventListener('webglcontextrestored', () => {
                console.log('[Kiosk] WebGL context restored');
            });

            const renderScene = new THREE.RenderPass(scene, camera);
            bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), config.bloomStrength, config.bloomRadius, config.bloomThreshold);
            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            sharedMaterial = new THREE.MeshStandardMaterial({ map: createPolimaxxTexture(config.baseColor), roughness: 0.3, metalness: 0.2 });
            eyeMaterial = new THREE.MeshPhongMaterial({ color: config.eyeColor, emissive: config.eyeColor, emissiveIntensity: 2.0, shininess: 100 });
            tailMaterial = new THREE.MeshStandardMaterial({ color: config.tailColor, emissive: config.tailColor, emissiveIntensity: 1.5 });

            updateGridColor(envSettings.preset);

            ambientLight = new THREE.AmbientLight(0x4488ff, envSettings.ambientIntensity); scene.add(ambientLight);
            sunLight = new THREE.DirectionalLight(0xffffff, envSettings.sunIntensity);
            sunLight.position.set(50, 100, 50); scene.add(sunLight);
            rimLight = new THREE.DirectionalLight(0xffffff, envSettings.rimIntensity);
            rimLight.position.set(-50, -50, -50); scene.add(rimLight);

            for (let i = 0; i < config.count; i++) rayInstances.push(new Stingray());

            updateCamera();
            setupInteractions();
            initGUI();
            setupExternalToggle();
            window.addEventListener('keydown', (e) => {
                if (e.code !== 'Space') return;
                if (e.target && e.target.closest && e.target.closest('.lil-gui')) return;
                if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) return;
                isPaused = !isPaused;
                setPauseLabel();
                scheduleGuiSync();
                e.preventDefault();
            });

            // Pause when tab is hidden — saves CPU/GPU and battery.
            let _wasPausedBeforeHide = false;
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    _wasPausedBeforeHide = isPaused;
                    isPaused = true;
                } else {
                    isPaused = _wasPausedBeforeHide;
                    lastTimestamp = 0;
                    setPauseLabel();
                    scheduleGuiSync();
                }
            });

            // ============================================================
            // Kiosk: auto-reload every 24h to reset any slow leaks.
            // ============================================================
            if (KIOSK.enableAutoReload) {
                setTimeout(() => {
                    console.log('[Kiosk] Auto-reload after', KIOSK.reloadAfterMs, 'ms');
                    location.reload();
                }, KIOSK.reloadAfterMs);
            }

            // ============================================================
            // Kiosk: periodic JS heap logging for remote diagnostics.
            // ============================================================
            if (KIOSK.enableMemoryLog && performance.memory) {
                setInterval(() => {
                    const m = performance.memory;
                    console.log('[Kiosk] Memory:', {
                        usedMB: (m.usedJSHeapSize / 1048576).toFixed(2),
                        totalMB: (m.totalJSHeapSize / 1048576).toFixed(2),
                        limitMB: (m.jsHeapSizeLimit / 1048576).toFixed(2),
                        rayCount: rayInstances.length
                    });
                }, KIOSK.memoryLogIntervalMs);
            }

            window.addEventListener('resize', onResize);
            requestAnimationFrame(animate);
        }

        function setupExternalToggle() {
            document.getElementById('mode-toggle').addEventListener('click', () => {
                envSettings.preset = (envSettings.preset === 'Dark') ? 'Daylight' : 'Dark';
                applyPreset(envSettings.preset);
            });
        }

        function setupInteractions() {
            const el = renderer.domElement;
            const touches = new Map();

            el.addEventListener('pointerdown', e => {
                if(e.target.closest('.lil-gui') || e.target.closest('#mode-toggle')) return; 
                if (e.button !== undefined && e.button !== 0) return;
                
                touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
                pointerPos = { x: e.clientX, y: e.clientY };
                
                if (touches.size === 2) {
                    const pts = Array.from(touches.values());
                    initialPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                    initialZoom = zoom;
                }
                
                el.setPointerCapture(e.pointerId);
            });

            window.addEventListener('pointermove', e => {
                if (!touches.has(e.pointerId)) return;
                touches.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (touches.size === 1) {
                    orbitRotation.y -= (e.clientX - pointerPos.x) * 0.005;
                    orbitRotation.x -= (e.clientY - pointerPos.y) * 0.005;
                    orbitRotation.x = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, orbitRotation.x));
                    pointerPos = { x: e.clientX, y: e.clientY };
                } else if (touches.size === 2) {
                    const pts = Array.from(touches.values());
                    const currentDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                    const diff = initialPinchDist - currentDist;
                    zoom = THREE.MathUtils.clamp(initialZoom + diff * 0.5, 30, 600);
                }
                
                updateCamera();
            });

            const endPointer = (e) => {
                touches.delete(e.pointerId);
                if (touches.size < 2) initialPinchDist = 0;
                if (touches.size === 1) {
                    const remaining = Array.from(touches.values())[0];
                    pointerPos = { x: remaining.x, y: remaining.y };
                }
            };

            window.addEventListener('pointerup', endPointer);
            window.addEventListener('pointercancel', endPointer);

            el.addEventListener('contextmenu', e => e.preventDefault());

            el.addEventListener('wheel', e => {
                zoom = THREE.MathUtils.clamp(zoom + e.deltaY * 0.1, 30, 600);
                updateCamera();
            }, { passive: true });
        }

        function updateCamera() {
            camera.position.set(
                zoom * Math.sin(orbitRotation.y) * Math.cos(orbitRotation.x),
                zoom * Math.sin(orbitRotation.x),
                zoom * Math.cos(orbitRotation.y) * Math.cos(orbitRotation.x)
            );
            camera.lookAt(0, 0, 0);
            viewSettings.orbitX = orbitRotation.x;
            viewSettings.orbitY = orbitRotation.y;
            viewSettings.zoom = zoom;
            scheduleGuiSync();
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight); 
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(timestamp) {
            requestAnimationFrame(animate);
            const rawDelta = timestamp - (lastTimestamp || timestamp);
            // Clamp delta to avoid teleport after tab switch / sleep / DevTools.
            // 100ms == 10fps: any genuinely slower frame is treated as 100ms so
            // a long stall can never fling the rays across the scene in one step.
            const delta = Math.min(Math.max(rawDelta, 0), 100);
            lastTimestamp = timestamp;
            if (!isPaused) rayInstances.forEach(ray => ray.update(delta, rayInstances));
            composer.render();
        }

        window.onload = init;
    </script>
</body>
</html>
